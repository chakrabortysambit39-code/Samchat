<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>Samchat AI</title>

<link rel="stylesheet" href="/static/style.css">
</head>

<body>

<div class="shell">

    <aside class="sidebar">

        <button id="newChatBtn" class="new-chat-btn">
            + New Chat
        </button>

        <div id="conversationList" class="conversation-list"></div>

        <div class="sidebar-footer">
            <button id="logoutBtn" class="ghost-btn">
                Log out
            </button>
        </div>

    </aside>


    <div class="app">

        <header class="topbar">

            <div class="brand">

                <span class="brand-dot"></span>

                <h1 id="assistantName">
                    Samchat
                </h1>

                <span
                    id="premiumBadge"
                    class="premium-badge hidden">
                    👑 PREMIUM
                </span>

                <span
                    id="usageBadge"
                    class="usage-badge">
                    Loading...
                </span>

            </div>


            <div class="topbar-right">

                <time id="clock"></time>

                <button
                    id="helpBtn"
                    class="ghost-btn">
                    Help
                </button>

                <button
                    id="clearBtn"
                    class="ghost-btn">
                    Clear
                </button>

                <button
                    id="premiumBtn"
                    class="premium-btn">
                    ⭐ Upgrade
                </button>

                <button
                    id="settingsBtn"
                    class="ghost-btn">
                    ⚙ Settings
                </button>

            </div>

        </header>



        <main class="chat-wrap">

            <div
                id="chatLog"
                class="chat-log">
            </div>

        </main>



        <footer class="composer">

            <div class="composer-row">

                <button id="webcamBtn" class="icon-btn">📷</button>

                <button id="screenBtn" class="icon-btn">🖥</button>

                <button id="uploadBtn" class="icon-btn">📎</button>

                <input
                    id="fileInput"
                    type="file"
                    accept="image/*"
                    hidden>

                <input
                    id="textInput"
                    class="text-input"
                    autocomplete="off"
                    placeholder="Message Samchat...">

                <button
                    id="micBtn"
                    class="icon-btn">
                    🎤
                </button>

                <button
                    id="sendBtn"
                    class="send-btn">
                    Send
                </button>

            </div>

        </footer>

    </div>

</div>



<!-- PREMIUM MODAL -->

<div
id="premiumModal"
class="modal hidden">

<div class="modal-card premium-card">

<h2>
Upgrade to Premium 👑
</h2>

<p>

Unlimited chats

<br>

Image Analysis

<br>

Priority AI

<br>

₹200 / 30 Days

</p>

<hr>

<div class="premium-price">

₹200

</div>

<button
id="premiumPayBtn"
class="primary-btn">

Pay with UPI

</button>

<br><br>

<input
id="txnInput"
placeholder="Enter UPI Transaction ID">

<br><br>

<button
id="submitTxnBtn"
class="primary-btn">

Submit Transaction

</button>

<button
id="closePremiumBtn"
class="ghost-btn">

Close

</button>

</div>

</div>



<!-- Webcam -->

<div id="webcamModal" class="modal hidden">

<div class="modal-card">

<h2>Webcam</h2>

<video
id="webcamVideo"
autoplay
playsinline></video>

<canvas
id="webcamCanvas"
hidden></canvas>

<div class="modal-actions">

<button
id="webcamCapture"
class="primary-btn">

Capture

</button>

<button
id="webcamCancel"
class="ghost-btn">

Cancel

</button>

</div>

</div>

</div>



<!-- Settings -->

<div
id="settingsModal"
class="modal hidden">

<div class="modal-card">

<h2>

Settings

</h2>

<label>

Your Name

<input
id="setUserName">

</label>

<label>

Assistant Name

<input
id="setAssistantName">

</label>

<label>

City

<input
id="setCity">

</label>

<label>

News Country

<input
id="setNewsCountry">

</label>

<label>

Groq API Key

<input
id="setGroqKey"
type="password">

</label>

<label>

Groq Model

<input
id="setGroqModel">

</label>

<div class="modal-actions">

<button
id="settingsSave"
class="primary-btn">

Save

</button>

<button
id="settingsCancel"
class="ghost-btn">

Cancel

</button>

</div>

</div>

</div>

<script src="/static/app.js"></script>

</body>

</html>
