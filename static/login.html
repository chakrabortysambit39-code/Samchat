<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jarvis — Sign in</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#0f1115;font-family:Segoe UI,Roboto,sans-serif;color:#e8e8ec}
.card{width:100%;max-width:380px;background:#171a21;border:1px solid #262a34;border-radius:12px;padding:32px}
h1{text-align:center;margin:0}p.sub{text-align:center;color:#8a8f9c}
.tabs{display:flex;background:#0f1115;padding:4px;border-radius:8px;margin:20px 0}
.tabs button{flex:1;padding:10px;border:none;background:transparent;color:#8a8f9c;border-radius:6px;cursor:pointer}
.tabs button.active{background:#262a34;color:#fff}
label{display:block;margin:12px 0 6px;color:#8a8f9c}
input{width:100%;padding:10px;border-radius:8px;border:1px solid #2c303a;background:#0f1115;color:#fff}
.submit,#adminLogin,#adminOk,#adminCancel{width:100%;padding:11px;border:none;border-radius:8px;cursor:pointer;font-weight:600}
.submit{margin-top:20px;background:#5b7cfa;color:#fff}
#adminLogin{margin-top:12px;background:#222;color:#fff}
.error{margin-top:12px;color:#ff6b6b;text-align:center;min-height:18px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.65);display:none;align-items:center;justify-content:center}
.modal.show{display:flex}
.box{width:340px;background:#171a21;padding:24px;border-radius:12px}
.row{display:flex;gap:10px;margin-top:16px}
#adminOk{background:#5b7cfa;color:#fff}
#adminCancel{background:#444;color:#fff}
</style>
</head>
<body>
<div class="card">
<h1>Jarvis</h1>
<p class="sub">Sign in to your assistant</p>

<div class="tabs">
<button id="tab-login" class="active">Log in</button>
<button id="tab-signup">Sign up</button>
</div>

<form id="auth-form">
<label>Email</label>
<input id="email" type="email" required>
<label>Password</label>
<input id="password" type="password" required>
<button class="submit" id="submit-btn" type="submit">Log in</button>
<div class="error" id="error"></div>
</form>

<button id="adminLogin">🔒 Admin Login</button>
</div>

<div class="modal" id="adminModal">
<div class="box">
<h2>Admin Login</h2>
<label>Admin Key</label>
<input id="adminKey" type="password">
<div class="row">
<button id="adminCancel" type="button">Cancel</button>
<button id="adminOk" type="button">Login</button>
</div>
</div>
</div>

<script>
const form=document.getElementById("auth-form");
const submit=document.getElementById("submit-btn");
const err=document.getElementById("error");
const tabLogin=document.getElementById("tab-login");
const tabSignup=document.getElementById("tab-signup");
const pwd=document.getElementById("password");
let mode="login";

function setMode(m){
 mode=m;
 tabLogin.classList.toggle("active",m==="login");
 tabSignup.classList.toggle("active",m==="signup");
 submit.textContent=m==="login"?"Log in":"Create account";
 pwd.autocomplete=m==="login"?"current-password":"new-password";
 err.textContent="";
}
tabLogin.onclick=()=>setMode("login");
tabSignup.onclick=()=>setMode("signup");

form.onsubmit=async(e)=>{
 e.preventDefault();
 err.textContent="";
 submit.disabled=true;
 const endpoint=mode==="login"?"/api/auth/login":"/api/auth/signup";
 try{
   const r=await fetch(endpoint,{
     method:"POST",
     headers:{"Content-Type":"application/json"},
     body:JSON.stringify({
       email:email.value.trim(),
       password:password.value
     })
   });
   const d=await r.json();
   if(!r.ok) throw new Error(d.detail||"Request failed");
   location.href="/";
 }catch(ex){
   err.textContent=ex.message;
   submit.disabled=false;
 }
};

const modal=document.getElementById("adminModal");
adminLogin.onclick=()=>modal.classList.add("show");
adminCancel.onclick=()=>modal.classList.remove("show");
adminOk.onclick=()=>{
 const key=adminKey.value.trim();
 if(!key){alert("Enter Admin Key");return;}
 localStorage.setItem("admin_key",key);
 location.href="/admin";
};
</script>
</body>
</html>
