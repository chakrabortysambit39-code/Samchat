<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jarvis — Sign in</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #0f1115;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    color: #e8e8ec;
  }
  .card {
    width: 100%;
    max-width: 360px;
    background: #171a21;
    border: 1px solid #262a34;
    border-radius: 12px;
    padding: 32px;
  }
  h1 {
    font-size: 20px;
    margin: 0 0 4px;
    text-align: center;
  }
  p.sub {
    text-align: center;
    color: #8a8f9c;
    font-size: 13px;
    margin: 0 0 24px;
  }
  .tabs {
    display: flex;
    margin-bottom: 20px;
    border-radius: 8px;
    background: #0f1115;
    padding: 4px;
  }
  .tabs button {
    flex: 1;
    padding: 8px;
    border: none;
    border-radius: 6px;
    background: transparent;
    color: #8a8f9c;
    font-size: 14px;
    cursor: pointer;
  }
  .tabs button.active {
    background: #262a34;
    color: #e8e8ec;
  }
  label {
    display: block;
    font-size: 13px;
    color: #8a8f9c;
    margin: 14px 0 6px;
  }
  input {
    width: 100%;
    padding: 10px 12px;
    border-radius: 8px;
    border: 1px solid #2c303a;
    background: #0f1115;
    color: #e8e8ec;
    font-size: 14px;
  }
  input:focus {
    outline: none;
    border-color: #5b7cfa;
  }
  button.submit {
    width: 100%;
    margin-top: 22px;
    padding: 11px;
    border: none;
    border-radius: 8px;
    background: #5b7cfa;
    color: white;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
  }
  button.submit:disabled {
    opacity: 0.6;
    cursor: default;
  }
  .error {
    margin-top: 14px;
    font-size: 13px;
    color: #ff6b6b;
    text-align: center;
    min-height: 16px;
  }
</style>
</head>
<body>
  <div class="card">
    <h1>Jarvis</h1>
    <p class="sub">Sign in to your assistant</p>

    <div class="tabs">
      <button id="tab-login" class="active">Log in</button>
      <button id="tab-signup">Sign up</button>
    </div>

    <form id="auth-form">
      <label for="email">Email</label>
      <input id="email" type="email" autocomplete="email" required>

      <label for="password">Password</label>
      <input id="password" type="password" autocomplete="current-password" required>

      <button type="submit" class="submit" id="submit-btn">Log in</button>
      <div class="error" id="error"></div>
    </form>
  </div>

<script>
  const tabLogin = document.getElementById('tab-login');
  const tabSignup = document.getElementById('tab-signup');
  const submitBtn = document.getElementById('submit-btn');
  const passwordInput = document.getElementById('password');
  const errorEl = document.getElementById('error');
  const form = document.getElementById('auth-form');

  let mode = 'login';

  function setMode(next) {
    mode = next;
    errorEl.textContent = '';
    if (mode === 'login') {
      tabLogin.classList.add('active');
      tabSignup.classList.remove('active');
      submitBtn.textContent = 'Log in';
      passwordInput.setAttribute('autocomplete', 'current-password');
    } else {
      tabSignup.classList.add('active');
      tabLogin.classList.remove('active');
      submitBtn.textContent = 'Create account';
      passwordInput.setAttribute('autocomplete', 'new-password');
    }
  }

  tabLogin.addEventListener('click', () => setMode('login'));
  tabSignup.addEventListener('click', () => setMode('signup'));

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    errorEl.textContent = '';
    submitBtn.disabled = true;

    const email = document.getElementById('email').value.trim();
    const password = passwordInput.value;
    const endpoint = mode === 'login' ? '/api/auth/login' : '/api/auth/signup';

    try {
      const res = await fetch(endpoint, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email, password }),
      });
      const data = await res.json();
      if (!res.ok) {
        throw new Error(data.detail || 'Something went wrong.');
      }
      window.location.href = '/';
    } catch (err) {
      errorEl.textContent = err.message;
      submitBtn.disabled = false;
    }
  });
</script>
</body>
</html>
